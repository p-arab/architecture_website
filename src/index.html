<html lang="en">

<head>

  <title data-i18n="zhikan"></title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/index.css">
  <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/projects.css">
  <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/project_details.css">
  <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/about_us.css">
  <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/footer.css">

  <link rel="stylesheet" href="../assets/css/bootstrap/bootstrap.css">
  <script src="../assets/js/bootstrap/jquery-3.6.0.js"></script>
  <script src="../assets/js/bootstrap/bootstrap.js"></script>
</head>

<body>
  <div class="white_bg_container">
    <div id="blue_bg_container" class="blue_bg_container">

      <img id="logo_animation_img" class="logo_animation_img" src="../assets/images/zhikan-logo-gif.gif" />
      <img id="logo_img" class="logo_img" src="../assets/images/zhikan-logo-en.png" />

      <div id="menu_desktop_wrapper" class="menu_desktop_wrapper">
        <div class="separate_line"></div>
        <a href="#" class="desktop_menu_item child bounce" onclick="ShowProjects()" data-i18n="projects"></a>
        <div class="separate_line"></div>
        <a href="#" class="desktop_menu_item child bounce" onclick="ShowAboutUs()" data-i18n="about_us"></a>
        <div class="separate_line"></div>
        <a href="#" class="desktop_menu_item child bounce" onclick="ShowContactUs()" data-i18n="contact_us"></a>
        <div class="separate_line"></div>
        <a href="#" class="desktop_menu_item" data-i18n="our_colleagues"></a>
        <div class="separate_line"></div>

      </div>


      <div id="language_wrapper" class="language_wrapper">
        <span id="language_txt_fa" class="language_txt pl-2" href="index.html"
          onclick="toggleSelectedLanguage('fa')">فارسی</span>
        <span id="language_txt_en" class="language_txt" href="index.html"
          onclick="toggleSelectedLanguage('en')">English</span>
      </div>


      <nav role='navigation' class="d-block d-md-none">
        <div id="menuToggle" class="">
          <input id="checkbox" type="checkbox" />
          <span></span>
          <span></span>
          <span></span>
          <ul id="menu">
            <a href="#" onclick="ShowProjects()">
              <li>پروژه ها</li>
            </a>
            <a href="#" onclick="ShowAboutUs()">
              <li>درباره ما</li>
            </a>
            <a href="#" onclick="ShowContactUs()">
              <li>تماس با ما</li>
            </a>
            <a class="dropdown">
              <li>مجله</li>
              <div class="dropdown-content">
                <p>منو تستی</p>
              </div>
            </a>
            <!-- <a href="#">
              <li>مجله</li>
            </a> -->
          </ul>
        </div>
      </nav>
    </div>

  </div>








  <script>
    let div = $("div[class='blue_bg_container']");
    window.onload = function () {
      let oldHeight = div.height();
      let newHeight = oldHeight ? 0 : "100vh";
      TweenMax.set(div, { height: newHeight });
      TweenMax.from(div, 2, { height: oldHeight });
      setTimeout(function () {
        document.getElementById("logo_animation_img").style.display = "flex";
      }, 1900)

      setTimeout(function () {
        document.getElementById("logo_animation_img").style.display = "none";
        document.getElementById("logo_img").style.display = "flex";
        myFunc()
      }, 8000)

      function myFunc() {
        let img = document.getElementById("logo_img");
        let oldTop = img.offsetTop;
        document.documentElement.style.setProperty('--logo-img-top', oldTop + "px");

        if (window.matchMedia('screen and (max-width: 768px)').matches) {
          document.getElementById('logo_img').style.animation = 'mymoveMobile 2s forwards'
        }
        else
          document.getElementById('logo_img').style.animation = 'mymove 2s forwards'
        document.getElementById('language_wrapper').style.animation = 'languageMove 2s forwards'

        setTimeout(function () {
          document.getElementById("menu_desktop_wrapper").style.display = "flex";
          document.getElementById("language_wrapper").style.display = "flex";
        }, 300)
      }
    }

    function ShowProjects() {
      document.getElementById('checkbox').checked = false

      let img = document.getElementById("logo_img");
      let oldRight = img.offsetLeft;
      let top = img.offsetTop;
      document.documentElement.style.setProperty('--logo-img-right', oldRight + "px");

      let menu = document.getElementById("menu_desktop_wrapper");
      let oldTop = menu.offsetTop;
      document.documentElement.style.setProperty('--menu-wrapper-top', oldTop + "px");


      document.getElementById('language_wrapper').style.animation = 'moving-to-header-lang 2s forwards'
      if (window.matchMedia('screen and (max-width: 768px)').matches) {
        document.getElementById('menu_desktop_wrapper').style.animation = 'fadeOut 2s forwards'
        document.getElementById('menuToggle').style.animation = 'fadeIn 3s forwards'
      }
      else {
        document.getElementById('logo_img').style.animation = 'logoRightMove 2s forwards'
        document.getElementById('menu_desktop_wrapper').style.animation = 'moving-to-header-menu 2s forwards'
      }

      setTimeout(function () {
        document.getElementById('blue_bg_container').style.padding = '0 10%'
      }, 500)
      setTimeout(function () {
        window.location.href = "Projects.html"
      }, 1500)
    }

    function ShowAboutUs() {
      document.getElementById('checkbox').checked = false

      let img = document.getElementById("logo_img");
      let oldRight = img.offsetLeft;
      let top = img.offsetTop;
      document.documentElement.style.setProperty('--logo-img-right', oldRight + "px");

      let menu = document.getElementById("menu_desktop_wrapper");
      let oldTop = menu.offsetTop;
      document.documentElement.style.setProperty('--menu-wrapper-top', oldTop + "px");


      document.getElementById('language_wrapper').style.animation = 'moving-to-header-lang 2s forwards'
      if (window.matchMedia('screen and (max-width: 768px)').matches) {
        document.getElementById('menu_desktop_wrapper').style.animation = 'fadeOut 2s forwards'
        document.getElementById('menuToggle').style.animation = 'fadeIn 3s forwards'
      }
      else {
        document.getElementById('logo_img').style.animation = 'logoRightMove 2s forwards'
        document.getElementById('menu_desktop_wrapper').style.animation = 'moving-to-header-menu 2s forwards'
      }

      setTimeout(function () {
        document.getElementById('blue_bg_container').style.padding = '0 10%'
      }, 500)
      setTimeout(function () {
        document.body.style.overflowY = 'scroll'
        window.location.href = "about_us.html"
      }, 1500)
    }

    function ShowContactUs() {
      document.getElementById('checkbox').checked = false

      let img = document.getElementById("logo_img");
      let oldRight = img.offsetLeft;
      let top = img.offsetTop;
      document.documentElement.style.setProperty('--logo-img-right', oldRight + "px");

      let menu = document.getElementById("menu_desktop_wrapper");
      let oldTop = menu.offsetTop;
      document.documentElement.style.setProperty('--menu-wrapper-top', oldTop + "px");


      document.getElementById('language_wrapper').style.animation = 'moving-to-header-lang 2s forwards'
      if (window.matchMedia('screen and (max-width: 768px)').matches) {
        document.getElementById('menu_desktop_wrapper').style.animation = 'fadeOut 2s forwards'
        document.getElementById('menuToggle').style.animation = 'fadeIn 3s forwards'
        document.body.style.overflowY = 'scroll'
      }
      else {
        document.getElementById('logo_img').style.animation = 'logoRightMove 2s forwards'
        document.getElementById('menu_desktop_wrapper').style.animation = 'moving-to-header-menu 2s forwards'
        document.body.style.overflow = 'hidden'
      }

      setTimeout(function () {
        document.getElementById('blue_bg_container').style.padding = '0 10%'
      }, 500)
      setTimeout(function () {
        window.location.href = "about_us.html"
      }, 1500)
    }







    window.addEventListener('DOMContentLoaded', async () => {
      const userPreferredLanguage = localStorage.getItem('language') || 'fa';
      const langData = await fetchLanguageData(userPreferredLanguage);
      updateContent(langData);
      toggleArabicStylesheet(userPreferredLanguage);

      const optionFa = document.getElementById('language_txt_fa')
      const optionEn = document.getElementById('language_txt_en')
      if (userPreferredLanguage === 'fa') {
          optionFa.style.display = 'flex'
          optionEn.style.display = 'none'
        } else if (userPreferredLanguage === 'en') {
          optionEn.style.display = 'flex'
          optionFa.style.display = 'none'
        }  
      // toggleSelectedLanguage(userPreferredLanguage)
    });

    async function changeLanguage(lang) {
      await setLanguagePreference(lang);

      const langData = await fetchLanguageData(lang);
      updateContent(langData);
      toggleArabicStylesheet(lang); // Toggle Arabic stylesheet
    }


    function updateContent(langData) {
      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.getAttribute('data-i18n');
        element.textContent = langData[key];
      });
    }

    function setLanguagePreference(lang) {
      localStorage.setItem('language', lang);
      // location.reload();
    }

    async function fetchLanguageData(lang) {
      const response = await fetch(`languages/${lang}.json`);
      return response.json();
    }

    function toggleArabicStylesheet(lang) {
      const head = document.querySelector('head');
      const link = document.querySelector('#styles-link');

      if (link) {
        head.removeChild(link);
      } else if (lang === 'fa') {
        const newLink = document.createElement('link');
        newLink.id = 'styles-link';
        newLink.rel = 'stylesheet';
        newLink.href = './assets/css/style-fa.css';
        head.appendChild(newLink);
      }
    }

    function toggleSelectedLanguage(lang) {
      const optionFa = document.getElementById('language_txt_fa')
      const optionEn = document.getElementById('language_txt_en')
      const positionFa = getComputedStyle(optionFa).position
      const displayFa = getComputedStyle(optionFa).display
      const positionEn = getComputedStyle(optionEn).position

      if (positionFa === 'absolute') {
        optionFa.style.position = 'relative'
        optionEn.style.position = 'relative'
        optionFa.style.display = 'flex'
        optionEn.style.display = 'flex'
      } else {
        optionFa.style.position = 'absolute'
        optionEn.style.position = 'absolute'
        if (lang === 'fa') {
          optionFa.style.display = 'flex'
          optionEn.style.display = 'none'
        } else if (lang === 'en') {
          optionEn.style.display = 'flex'
          optionFa.style.display = 'none'
        }  
        changeLanguage(lang)
      }
    }


  </script>

</body>


</html>
