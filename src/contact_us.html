<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="zhikan_title"></title>

    <link rel="stylesheet" href="../assets/css/bootstrap/bootstrap.css">
    <script src="../assets/js/bootstrap/jquery-3.6.0.js"></script>
    <script src="../assets/js/bootstrap/bootstrap.js"></script>

    <script type="text/javascript" src="../assets/js/header.js" async></script>
    <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/header.css">

    <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/contact_us.css">
    <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/footer.css">

</head>

<body class="limit_body">
    <div id="blue_bg_container" class="blue_bg_container">
        <img id="logo_img" class="logo_img" src="../assets/images/zhikan-logo-en.png" />
        <div id="menu_desktop_wrapper" class="menu_desktop_wrapper">
            <a href="#" onclick="showProjects()" data-i18n="projects"></a>
            <a href="#" onclick="showAboutUs()" data-i18n="about_us"></a>
            <a href="#" onclick="showContactUs()" data-i18n="contact_us"></a>
            <a href="#" onclick="showContactUs()" data-i18n="our_colleagues"></a>
        </div>


        <div id="language_wrapper" class="language_wrapper">
            <span id="language_txt_fa" class="language_txt px-2" href="#"
                onclick="toggleSelectedLanguage('fa')">فارسی</span>
            <span id="language_txt_en" class="language_txt" href="#"
                onclick="toggleSelectedLanguage('en')">English</span>
        </div>


        <nav role='navigation' class="d-block d-md-none">
            <div id="menuToggle" class="">
                <input id="checkbox" type="checkbox" />
                <span></span>
                <span></span>
                <span></span>
                <ul id="menu">
                    <a href="#" onclick="showProjects()">
                        <li>پروژه ها</li>
                    </a>
                    <a href="#" onclick="showAboutUs()">
                        <li>درباره ما</li>
                    </a>
                    <a href="#" onclick="showContactUs()">
                        <li>تماس با ما</li>
                    </a>
                    <a class="dropdown">
                        <li>مجله</li>
                        <div class="dropdown-content">
                            <p>منو تستی</p>
                        </div>
                    </a>
                    <!-- <a href="#">
                <li>مجله</li>
              </a> -->
                </ul>
            </div>
        </nav>
    </div>
    <div id="contact_us_wrapper" class="contact_us_wrapper">
        <div class="d-flex flex-wrap">
            <div class="col-12 col-md-6 input_contact_wrapper">
                <div class=" row m-0 justify-content-between">
                    <div class="col-12 col-md-6">
                        <input class="w-100" type="text" id="name" >
                        <label class="text-input-label" for="name" data-i18n="name_family"></label>
                    </div>
                    <div class="col-12 col-md-6">
                        <input  class="w-100" type="text" id="email">
                        <label class="text-input-label2" for="email" data-i18n="email"></label>
                    </div>
                </div>
                <div class=" row m-0 justify-content-between">
                    <div class="col-12 col-md-6">
                        <input class="place w-100" id="subject" type="text" id="subject">
                        <label class="text-input-label" for="subject" data-i18n="subject"></label>
                    </div>
                    <div class="col-12 col-md-6">
                        <input class="w-100" type="text" id="department">
                        <label class="text-input-label2" for="department" data-i18n="department"></label>
                    </div>
                </div>
                <div class="col-12 p-0">
                    <textarea class="w-100" id="message" rows="4"
                        cols="50"></textarea>
                        <label class="text-input-label" for="message" data-i18n="message"></label>
                </div>
                <div class="row m-0">
                    <button disabled class="send_btn col-12 col-md-3" data-i18n="send"></button>
                </div>
            </div>

            <div class="contact_us_map col-12 col-md-6">
                <div>
                    <img class="map_img" src="../assets/images/map.png" alt="Map Location" />
                </div>

                <div class="row m-0 text-right ">
                    <div class="col-6 p-0 info_row">
                        <img class="contact_icon" alt="Pocket Icon" src="../assets/images/sms.png">
                        <span>
                            info@zhikan.com
                        </span>
                    </div>
                    <div class="col-6 p-0 info_row">
                        <img class="contact_icon" alt="Phone Icon" src="../assets/images/call.png">
                        <span>
                            021-88215037
                        </span>
                    </div>
                </div>
                <div class="m-0 info_row">
                    <img class="contact_icon" alt="Phone Icon" src="../assets/images/location.png">
                    <span data-i18n="zhikan_address"></span>
                </div>
            </div>
        </div>

        <div class="footer_wrapper">
            <span class="gray_footer">
                <span data-i18n="all_rights"></span>
                <span class="colored_footer" data-i18n="jikan_group"></span>
                <span data-i18n="is"></span>
            </span>
        </div>
    </div>
</body>

</html>
