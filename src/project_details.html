<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="zhikan_title"></title>

    <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/project_details.css">
    <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/footer.css">
    <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/about_us.css">

    <script type="text/javascript" src="../assets/js/header.js" async></script>
    <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="../assets/css/header.css">

    <link rel="stylesheet" href="../assets/css/bootstrap/bootstrap.css">
    <script src="../assets/js/bootstrap/jquery-3.6.0.js"></script>
    <script src="../assets/js/bootstrap/bootstrap.js"></script>
</head>

<body class="limit_body">
    <div id="blue_bg_container" class="blue_bg_container">
        <img alt="zhikan logo" id="logo_img" class="logo_img" src="../assets/images/zhikan-logo-en.png" />

        <div id="menu_desktop_wrapper" class="menu_desktop_wrapper">
            <a href="#" onclick="showProjects()" data-i18n="projects"></a>
            <a href="#" onclick="showAboutUs()" data-i18n="about_us"></a>
            <a href="#" onclick="showContactUs()" data-i18n="contact_us"></a>
            <a href="#" onclick="showContactUs()" data-i18n="our_colleagues"></a>
        </div>


        <div id="language_wrapper" class="language_wrapper">
            <span id="language_txt_fa" class="language_txt px-2" href="#"
                onclick="toggleSelectedLanguage('fa')">فارسی</span>
            <span id="language_txt_en" class="language_txt" href="#"
                onclick="toggleSelectedLanguage('en')">English</span>
        </div>


        <nav role='navigation' class="d-block d-md-none">
            <div id="menuToggle" class="">
                <input id="checkbox" type="checkbox" />
                <span></span>
                <span></span>
                <span></span>
                <ul id="menu">
                    <a href="#" onclick="showProjects()">
                        <li data-i18n="projects"></li>
                    </a>
                    <a href="#" onclick="showAboutUs()">
                        <li data-i18n="about_us"></li>
                    </a>
                    <a href="#" onclick="showContactUs()">
                        <li data-i18n="contact_us"></li>
                    </a>
                    <a class="dropdown">
                        <li data-i18n="other"></li>
                        <div class="dropdown-content">
                            <p data-i18n="our_colleagues"></p>
                        </div>
                    </a>
                    <!-- <a href="#">
                <li data-i18n="other"></li>
              </a> -->
                </ul>
            </div>
        </nav>
    </div>

    <div id="project_details_wrapper" class="row project_details_wrapper m-0">
        <div class="col-12 col-md-3 ">
            <div class="card_sidebar">
                <div class="title_sidebar" data-i18n="project_title"></div>
                <div class="desc_sidebar" data-i18n="employer">
                </div>
                <div class="desc_sidebar" data-i18n="services">
                </div>
                <div class="desc_sidebar" data-i18n="location">
                </div>
                <div class="desc_sidebar" data-i18n="time">
                </div>
            </div>
        </div>
        <div class="col-12 col-md-9" style="overflow: hidden;">
            <div style="position: relative;">
                <img id="main_pic" class="main_pic" src="../assets/images/Project-Pic.png" alt="Main Picture">
                <button class="gallery-btn" onclick="location.href= './project_details_gallery.html';"
                    data-i18n="gallery"></button>
            </div>

            <div class="detail_title" data-i18n="project_title"></div>
            <div class="detail_desc" data-i18n="project_description">
            </div>
        </div>

        <div class="footer_wrapper">
            <span class="gray_footer">
                <span data-i18n="all_rights"></span>
                <span class="colored_footer" data-i18n="jikan_group"></span>
                <span data-i18n="is"></span>
            </span>
        </div>

    </div>

    <script>
        function changeMainImage(value) {
            document.getElementById("main_pic").src = value
        }
    </script>
</body>

</html>
